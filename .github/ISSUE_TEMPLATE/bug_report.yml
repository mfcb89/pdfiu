name: Informar de un error / Bug report
description: Notifica un fallo o comportamiento inesperado en PDFiu / Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar PDFiu. No adjuntes documentos reales, datos privados, certificados ni contraseñas.
        Thanks for helping improve PDFiu. Do not attach real documents, private data, certificates, or passwords.
  - type: input
    id: version
    attributes:
      label: Versión de PDFiu / PDFiu version
      placeholder: "0.10.39"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo / Operating system
      options:
        - Windows 11 x64
        - Windows 10 x64
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Otro / Other
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Modo de ejecución / Install method
      options:
        - Instalador oficial / Official installer
        - Desde código fuente (Python) / From source (Python)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir / Steps to reproduce
      placeholder: |
        1. Abrir...
        2. Pulsar en...
        3. Observar el error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado / Expected behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Información adicional / Additional context
      description: Capturas anonimizadas, registro de error o PDF sintético de ejemplo.
